# =====================================================================
# Profil DEVELOPPEMENT
#
# ATTENTION : le fichier .env n'est lu QUE par docker compose.
# Il n'est PAS charge par Spring Boot lors d'un "mvnw spring-boot:run".
# Les valeurs ci-dessous sont celles que l'application utilise reellement.
#
# Le conteneur PostgreSQL est expose sur le port 5433 cote Windows,
# car un PostgreSQL 18 local occupe deja le port 5432.
# =====================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/sogeco_fleet
    username: sogeco
    password: ${DB_PASSWORD:Primce2005@}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true   # detection des requetes N+1

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:Primce2005@}

logging:
  level:
    com.sogeco: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: true

sogeco:
  cors:
    allowed-origins: http://localhost:4000,http://127.0.0.1:4000,http://localhost:5000,http://localhost:5173,http://localhost:5180