# =====================================================================
# Profil DEVELOPPEMENT
#
# "dev" est le profil par defaut (spring.profiles.default dans
# application.yml) : actif des que SPRING_PROFILES_ACTIVE n'est pas
# positionne explicitement — y compris dans un conteneur ou sur un
# hebergeur, si on oublie de le definir. D'ou les placeholders ${...}
# ci-dessous plutot que des valeurs figees : sans eux, DB_HOST/REDIS_HOST
# seraient ignores partout sauf en environnement "prod", et le meme
# oubli reproduirait exactement l'erreur "connection refused" locale
# (connexion a localhost au lieu de l'hote vise).
#
# Ports par defaut : ceux du docker-compose local (PostgreSQL expose
# sur 5433 cote Windows, un PostgreSQL 18 local occupant deja le 5432).
# =====================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sogeco_fleet}
    username: ${DB_USER:sogeco}
    password: ${DB_PASSWORD:Primce2005@}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true   # detection des requetes N+1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Primce2005@}

logging:
  level:
    com.sogeco: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: true

sogeco:
  cors:
    allowed-origins: http://localhost:4000,http://127.0.0.1:4000,http://localhost:5000,http://localhost:5173,http://localhost:5180