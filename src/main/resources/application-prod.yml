spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.sogeco: INFO
  pattern:
    # Bloc litteral : les guillemets du JSON n'ont alors pas besoin
    # d'echappement YAML — la version precedente (scalaire simple avec
    # echappements imbriques) n'etait pas un YAML valide et empechait
    # le demarrage sous ce profil.
    console: |-
      {"ts":"%d{ISO8601}","level":"%level","trace":"%X{traceId}","logger":"%logger{36}","msg":"%msg"}%n
