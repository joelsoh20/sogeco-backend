services:

  postgres:
    image: postgres:16-alpine
    container_name: sogeco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sogeco_fleet}
      POSTGRES_USER: ${DB_USER:-sogeco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sogeco_dev_password}
      TZ: Africa/Douala
    ports:
      # Port cote Windows. 5433 car un PostgreSQL local occupe deja 5432.
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cree la base 'traccar' au tout premier demarrage (volume vide) ;
      # POSTGRES_DB ne cree que la base de l'application (sogeco_fleet).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sogeco} -d ${DB_NAME:-sogeco_fleet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sogeco-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sogeco_redis_password}
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traccar:
    image: traccar/traccar:latest
    container_name: sogeco-traccar
    restart: unless-stopped
    environment:
      TZ: Africa/Douala
    ports:
      # Interface web et API REST
      - "8082:8082"
      # Protocole osmand : application Traccar Client sur telephone
      - "5055:5055"
      - "5055:5055/udp"
      # Protocole gps103 : boitiers GPS103/TK102 et compatibles
      - "5001:5001"
      - "5001:5001/udp"
      # Protocole meiligao : boitiers LT08, Meiligao et compatibles (port
      # standard 5009, cable en dur cote materiel sur ces boitiers)
      - "5009:5009"
      - "5009:5009/udp"
      # Eventail large des marques de boitiers GPS les plus courantes -- un
      # port par protocole, voir le commentaire dans traccar.xml. Ports
      # laisses au repos si aucun boitier ne s'y connecte : aucun cout.
      - "5002:5002"     # tk103
      - "5002:5002/udp"
      - "5003:5003"     # gl100 (Queclink)
      - "5003:5003/udp"
      - "5004:5004"     # gl200 (Queclink)
      - "5004:5004/udp"
      - "5006:5006"     # xexun
      - "5006:5006/udp"
      - "5007:5007"     # totem
      - "5007:5007/udp"
      - "5011:5011"     # suntech
      - "5011:5011/udp"
      - "5013:5013"     # h02
      - "5013:5013/udp"
      - "5015:5015"     # huabao (JT/T 808)
      - "5015:5015/udp"
      - "5020:5020"     # meitrack
      - "5020:5020/udp"
      - "5022:5022"     # gt02
      - "5022:5022/udp"
      - "5023:5023"     # gt06
      - "5023:5023/udp"
      - "5027:5027"     # teltonika
      - "5027:5027/udp"
      - "5033:5033"     # cellocator
      - "5033:5033/udp"
      - "5036:5036"     # tk102
      - "5036:5036/udp"
      - "5043:5043"     # globalsat
      - "5043:5043/udp"
      - "5044:5044"     # atrack
      - "5044:5044/udp"
      - "5046:5046"     # ruptela
      - "5046:5046/udp"
      - "5064:5064"     # eelink
      - "5064:5064/udp"
      - "5078:5078"     # gosafe
      - "5078:5078/udp"
      - "5082:5082"     # calamp
      - "5082:5082/udp"
      - "5093:5093"     # watch (montres GPS)
      - "5093:5093/udp"
    volumes:
      - ./traccar/conf:/opt/traccar/conf
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sogeco-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sogeco.cm
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  traccar_data:
  traccar_logs: